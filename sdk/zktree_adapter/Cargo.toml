[package]
name = "zktree_adapter"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
async-trait = "0.1.64"
anyhow = "1.0.69"
serde = { version = "1.0", features = ["serde_derive"] }
serde_json = "1.0"
hex = "0.4"
primitive-types = { version = "0.12.1", default-features = false }
async-channel = "1.9.0"
tokio = { version = "1.26.0", features = ["rt", "sync", "macros", "time"] }
log = { version = "0.4.19", features = [] }
mongodb = { version = "2.5.0", default-features = false, features=["tokio-sync"] }
lazy_static = "1.4.0"
poseidon = { git = "https://github.com/lanbones/poseidon" }
pairing = { git = "https://github.com/lanbones/pairing", package = "pairing_bn256"}
thiserror = "1.0.38"
